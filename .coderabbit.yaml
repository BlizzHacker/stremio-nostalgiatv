# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
language: en-US
tone_instructions: >-
  Be direct; skip praise and preamble. This is a Stremio addon. Prioritize
  addon-manifest correctness, upstream fetch robustness, and response-shape
  conformance over style.
early_access: false
enable_free_tier: true

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: true
  abort_on_close: true

  slop_detection:
    enabled: true
    label: slop

  path_filters:
    - "!**/*.min.js"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/node_modules/**"
    - "!**/*.lock"
    - "!**/vendor/**"
    - "!**/__pycache__/**"

  path_instructions:
    - path: "**/*.{js,ts}"
      instructions: >-
        Stremio consumes the manifest and handler responses strictly. A response
        whose shape does not match what the addon protocol expects fails silently
        in the client rather than surfacing an error, so treat shape changes as
        correctness-critical and check them against the declared manifest
        resources, types, and id prefixes.

        Handlers are called frequently by many clients. Flag per-request work
        that should be cached, upstream fetches without timeout, and unbounded
        concurrency against upstream sources.
    - path: ".github/workflows/**"
      instructions: >-
        Check for unpinned third-party actions, secrets exposed to
        pull_request_target, and steps interpolating untrusted PR text into run
        blocks.

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    ignore_usernames:
      - dependabot
      - dependabot[bot]

  tools:
    eslint:
      enabled: true
    gitleaks:
      enabled: true
    semgrep:
      enabled: true
    languagetool:
      enabled: false

chat:
  art: false
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    scope: auto
